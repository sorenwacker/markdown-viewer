name: Snapcraft

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'snap/**'
      - '.github/workflows/snap.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}

      # Publishing needs the store name registered to this account and a
      # SNAPCRAFT_TOKEN secret; without the secret the build still runs and
      # the snap is kept as a workflow artifact.
      - uses: snapcore/action-publish@v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Edge glow for the M strokes -->
    <filter id="glow-edge" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Horizontal gradient sweeping the three nodus colors across the M -->
    <linearGradient id="m-gradient" x1="104" y1="0" x2="408" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ffcc"/>
      <stop offset="0.5" stop-color="#00ccff"/>
      <stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="104" fill="#0a0a12"/>

  <!-- Subtle grid pattern -->
  <g stroke="#00ffcc" stroke-opacity="0.07" stroke-width="1">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- The M as a single stroke, filled with a left-to-right gradient that
       morphs through the three nodus colors edge to edge. -->
  <path d="M104 400 L104 112 L256 296 L408 112 L408 400"
        fill="none" stroke="url(#m-gradient)" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-edge)"/>
</svg>

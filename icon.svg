<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Edge glow for the M strokes -->
    <filter id="glow-edge" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="104" fill="#0a0a12"/>

  <!-- Subtle grid pattern -->
  <g stroke="#00ffcc" stroke-opacity="0.07" stroke-width="1">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- The M, drawn so each of the three nodus colors is clearly present:
       cyan left leg, cyan-blue center chevron, magenta right leg. -->
  <g fill="none" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-edge)">
    <path d="M104 400 L104 112" stroke="#00ffcc"/>
    <path d="M104 112 L256 296 L408 112" stroke="#00ccff"/>
    <path d="M408 112 L408 400" stroke="#ff00ff"/>
  </g>
</svg>
